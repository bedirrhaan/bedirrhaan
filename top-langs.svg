<svg xmlns="http://www.w3.org/2000/svg" width="300" height="195" role="img" aria-labelledby="title">
  <title id="title">Most used languages</title>
  <rect width="300" height="195" rx="8" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="299" height="194" rx="8" fill="none" stroke="#7F1D1D"/>
  <text x="20" y="32" fill="#EF4444" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Most Used Languages</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    <text x="20" y="62" fill="#E5E5E5">C</text>
    <text x="248" y="62" fill="#A3A3A3" text-anchor="end">32.4%</text>
    <rect x="20" y="68" width="256" height="6" rx="3" fill="#1F1F1F"/>
    <rect x="20" y="68" width="83" height="6" rx="3" fill="#555555"/>

    <text x="20" y="92" fill="#E5E5E5">Python</text>
    <text x="248" y="92" fill="#A3A3A3" text-anchor="end">24.0%</text>
    <rect x="20" y="98" width="256" height="6" rx="3" fill="#1F1F1F"/>
    <rect x="20" y="98" width="61" height="6" rx="3" fill="#3572A5"/>

    <text x="20" y="122" fill="#E5E5E5">HTML</text>
    <text x="248" y="122" fill="#A3A3A3" text-anchor="end">12.2%</text>
    <rect x="20" y="128" width="256" height="6" rx="3" fill="#1F1F1F"/>
    <rect x="20" y="128" width="31" height="6" rx="3" fill="#e34c26"/>

    <text x="20" y="152" fill="#E5E5E5">TypeScript</text>
    <text x="248" y="152" fill="#A3A3A3" text-anchor="end">10.4%</text>
    <rect x="20" y="158" width="256" height="6" rx="3" fill="#1F1F1F"/>
    <rect x="20" y="158" width="27" height="6" rx="3" fill="#3178c6"/>

    <text x="20" y="182" fill="#E5E5E5">CSS · C++ · JS</text>
    <text x="248" y="182" fill="#A3A3A3" text-anchor="end">21%</text>
  </g>
</svg>
